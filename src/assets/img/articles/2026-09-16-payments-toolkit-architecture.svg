<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt-arch-title pt-arch-desc">
      <title id="pt-arch-title">payments-toolkit architecture</title>
      <desc id="pt-arch-desc">Diagram showing the Frontend talking to the Agent over AG-UI/SSE, and the Agent talking to an MCP server, with the Agent as the reasoning layer between the two protocols.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d4d4d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f8c013"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f7f7"/>

      <!-- Arrows (drawn before nodes) -->
      <!-- Frontend -> Agent -->
      <line x1="248" y1="120" x2="344" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Agent -> MCP -->
      <line x1="544" y1="120" x2="640" y2="120" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="260" y="100" width="72" height="12" rx="2" fill="#f7f7f7"/>
      <text x="296" y="109" fill="#2e5aa8" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AG-UI &#183; SSE</text>

      <rect x="572" y="100" width="40" height="12" rx="2" fill="#f7f7f7"/>
      <text x="592" y="109" fill="#2e5aa8" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MCP</text>

      <!-- Node: Frontend (backend treatment) -->
      <rect x="48" y="88" width="200" height="64" rx="6" fill="#f7f7f7"/>
      <rect x="48" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <text x="148" y="116" fill="#171717" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Frontend</text>
      <text x="148" y="132" fill="#4d4d4d" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Vue</text>

      <!-- Node: Agent (focal) -->
      <rect x="344" y="88" width="200" height="64" rx="6" fill="#f7f7f7"/>
      <rect x="344" y="88" width="200" height="64" rx="6" fill="rgba(248,192,19,0.08)" stroke="#f8c013" stroke-width="1"/>
      <text x="444" y="116" fill="#171717" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Agent</text>
      <text x="444" y="132" fill="#4d4d4d" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ADK &#183; HTTP server</text>

      <!-- Node: MCP (store treatment) -->
      <rect x="640" y="88" width="200" height="64" rx="6" fill="#f7f7f7"/>
      <rect x="640" y="88" width="200" height="64" rx="6" fill="rgba(23,23,23,0.05)" stroke="#4d4d4d" stroke-width="1"/>
      <text x="740" y="116" fill="#171717" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">MCP server</text>
      <text x="740" y="132" fill="#4d4d4d" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">tools &#183; resources</text>
    </svg>
