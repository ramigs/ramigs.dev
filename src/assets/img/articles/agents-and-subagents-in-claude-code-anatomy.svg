<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#42210b" />
    </marker>
  </defs>

  <rect x="1" y="1" width="918" height="578" rx="12" fill="#fafafa" stroke="#dedede" />

  <!-- Harness -->
  <rect x="30" y="28" width="860" height="140" rx="10" fill="#ffffff" stroke="#42210b" stroke-width="2" />
  <text x="50" y="55" font-size="15" font-weight="700" fill="#42210b" letter-spacing="0.5">HARNESS &#183; Claude Code</text>
  <text x="50" y="75" font-size="12" fill="#606060">defines the environment &#183; provides tools &#183; decides which agent to instantiate</text>

  <rect x="50" y="92" width="380" height="58" rx="6" fill="#fafafa" stroke="#dedede" />
  <text x="66" y="114" font-size="13" font-weight="700" fill="#42210b">Built-in agents</text>
  <text x="66" y="134" font-size="12" fill="#404040" font-family="Menlo, monospace">Explore &#183; Plan &#183; general-purpose</text>

  <rect x="450" y="92" width="420" height="58" rx="6" fill="#fafafa" stroke="#dedede" />
  <text x="466" y="114" font-size="13" font-weight="700" fill="#42210b">Custom agent</text>
  <text x="466" y="134" font-size="12" fill="#404040" font-family="Menlo, monospace">.claude/agents/my-agent.md</text>

  <!-- arrow harness -> agent -->
  <line x1="460" y1="168" x2="460" y2="204" stroke="#42210b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="472" y="192" font-size="11" fill="#606060" font-style="italic">instantiates</text>

  <!-- Agent box -->
  <rect x="150" y="208" width="460" height="270" rx="10" fill="#ffffff" stroke="#f8c013" stroke-width="3" />
  <text x="170" y="236" font-size="16" font-weight="700" fill="#42210b">AGENT</text>

  <rect x="170" y="250" width="420" height="40" rx="6" fill="#fafafa" stroke="#dedede" />
  <text x="184" y="275" font-size="13" fill="#404040">User instructions</text>

  <rect x="170" y="300" width="420" height="40" rx="6" fill="#fafafa" stroke="#dedede" />
  <text x="184" y="325" font-size="13" fill="#404040">Predefined behavior &#8212; scope + behavior</text>

  <rect x="170" y="350" width="420" height="90" rx="6" fill="#fafafa" stroke="#dedede" />
  <text x="184" y="372" font-size="12" font-weight="700" fill="#42210b">Context window &#8212; its own token budget</text>
  <g>
    <rect x="184" y="384" width="16" height="16" fill="#f8c013" />
    <rect x="206" y="384" width="16" height="16" fill="#f8c013" />
    <rect x="228" y="384" width="16" height="16" fill="#f8c013" />
    <rect x="250" y="384" width="16" height="16" fill="#f8c013" />
    <rect x="272" y="384" width="16" height="16" fill="#f8c013" />
    <rect x="294" y="384" width="16" height="16" fill="#ffffff" stroke="#dedede" />
    <rect x="316" y="384" width="16" height="16" fill="#ffffff" stroke="#dedede" />
    <rect x="338" y="384" width="16" height="16" fill="#ffffff" stroke="#dedede" stroke-dasharray="2 2" />
  </g>
  <text x="184" y="422" font-size="11" fill="#808080">tokens used &#8594; &#8592; token limit</text>

  <!-- Model box -->
  <rect x="700" y="253" width="180" height="120" rx="10" fill="#ffffff" stroke="#42210b" stroke-width="2" />
  <text x="790" y="318" font-size="15" font-weight="700" fill="#42210b" text-anchor="middle">MODEL</text>

  <line x1="610" y1="278" x2="698" y2="278" stroke="#42210b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="270" font-size="11" fill="#606060" font-style="italic" text-anchor="middle">calls</text>

  <line x1="698" y1="330" x2="610" y2="330" stroke="#42210b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="348" font-size="11" fill="#606060" font-style="italic" text-anchor="middle">returns results</text>

  <!-- Tools -->
  <line x1="380" y1="478" x2="380" y2="504" stroke="#42210b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="392" y="496" font-size="11" fill="#606060" font-style="italic">uses</text>

  <rect x="150" y="508" width="460" height="56" rx="10" fill="#fafafa" stroke="#dedede" stroke-dasharray="6 4" />
  <text x="168" y="530" font-size="13" font-weight="700" fill="#42210b">TOOLS / ENVIRONMENT</text>
  <text x="168" y="550" font-size="12" fill="#404040" font-family="Menlo, monospace">terminal &#183; files &#183; web &#183; database</text>
</svg>
